# Dependency license policy, checked in CI with `cargo deny check licenses`.
#
# Everything that ships must be permissively licensed, with one deliberate
# exception: the three Chimera runtime crates under src-tauri/crates are
# AGPL-3.0-only (see THIRD_PARTY_NOTICES.md and crates/NOTICE). Adding another
# copyleft dependency needs an explicit exception here and a notice entry.

[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "CDLA-Permissive-2.0",
]
exceptions = [
  { allow = ["AGPL-3.0-only"], crate = "chimera-domain" },
  { allow = ["AGPL-3.0-only"], crate = "chimera-platform" },
  { allow = ["AGPL-3.0-only"], crate = "chimera-runtime" },
]
