[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "chimera-plus-plus" },
    { allow = ["AGPL-3.0-only"], crate = "chimera-runtime" },
    { allow = ["AGPL-3.0-only"], crate = "chimera-platform" },
    { allow = ["AGPL-3.0-only"], crate = "chimera-domain" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Duojiyi/chimera-plusplus.git",
    "https://github.com/Wangnov/Codex-App-Manager.git",
]
