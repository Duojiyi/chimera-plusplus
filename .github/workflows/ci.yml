name: Chimera++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chimera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Check committed secrets
        run: node scripts/check-committed-secrets.mjs

      - name: Check local-only paths
        run: node scripts/check-local-only-paths.mjs

      - name: Check repository references
        run: node scripts/check-repo-references.mjs
      - name: Check preset promotion data
        run: node scripts/check-preset-promotion.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.12.3
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version consistency
        run: node scripts/verify-release-version.mjs

      - name: Test release safety guards
        run: node --test scripts/promote-latest-release.test.mjs scripts/release-workflow-guards.test.mjs scripts/check-single-config-writer.test.mjs scripts/worktree-checks.test.mjs scripts/check-architecture.test.mjs

      - name: Check backend layering
        shell: bash
        env:
          ARCHITECTURE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          set -euo pipefail
          if [[ "$ARCHITECTURE_BASE_REF" == "0000000000000000000000000000000000000000" ]]; then
            ARCHITECTURE_BASE_REF=origin/main
          fi
          git cat-file -e "$ARCHITECTURE_BASE_REF^{commit}" || git fetch --no-tags origin "$ARCHITECTURE_BASE_REF"
          node scripts/check-architecture.mjs --baseline-ref "$ARCHITECTURE_BASE_REF"

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Run frontend unit tests
        shell: bash
        run: |
          mkdir -p test-results
          pnpm test:unit --reporter=default --reporter=junit --outputFile=test-results/vitest.junit.xml

      - name: Build renderer and enforce bundle budgets
        run: pnpm build:renderer:check

      - name: Verify single Codex config writer
        run: node scripts/check-single-config-writer.mjs

      - name: Audit all npm dependencies
        run: pnpm audit --audit-level=low

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-test-results-${{ matrix.os }}-${{ github.sha }}
          path: test-results/vitest.junit.xml
          if-no-files-found: error

  backend:
    name: Backend Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-11-arm
          - macos-15
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Setup LLVM for Windows ARM64
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev

      - name: Prepare frontend placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The shared lockfile is audited once; vulnerabilities block the release.
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-deny

      - name: Check Rust licenses and sources
        if: runner.os == 'Linux'
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses sources bans
