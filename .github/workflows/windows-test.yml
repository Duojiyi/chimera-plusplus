name: Windows Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - chimera/v2-backend

permissions:
  contents: read

concurrency:
  group: chimera-windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows test package
        # This workflow only smoke-tests that the app compiles and bundles; it
        # never consumes the updater .sig, so it must not have access to the
        # real TAURI_SIGNING_PRIVATE_KEY secret. Disable updater artifact
        # creation for this build only (via a config overlay) instead of
        # signing with the production key.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configPath = Join-Path $env:RUNNER_TEMP 'no-updater-artifacts.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $configPath -Encoding utf8
          pnpm tauri build --bundles msi --config $configPath

      - name: Upload Windows test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimera++-Windows-Test-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/chimera-plus-plus.exe
          if-no-files-found: error
