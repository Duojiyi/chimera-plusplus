name: macOS Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - chimera/v2-backend

permissions:
  contents: read

concurrency:
  group: chimera-macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal macOS Test Package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify renderer contracts
        run: pnpm exec tsc --noEmit

      - name: Verify Codex account and relay switching
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test provider_service provider_service_switch_codex
          cargo test --manifest-path src-tauri/Cargo.toml --test provider_commands codex_startup_import

      - name: Build universal macOS app
        # This workflow only smoke-tests that the app compiles and bundles; it
        # never consumes the updater .sig, so it must not have access to the
        # real TAURI_SIGNING_PRIVATE_KEY secret. Disable updater artifact
        # creation for this build only (via a config overlay) instead of
        # signing with the production key.
        shell: bash
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/no-updater-artifacts.json"
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "$config_path"
          pnpm tauri build --target universal-apple-darwin --bundles app --config "$config_path"

      - name: Prepare test artifact
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo 'No universal macOS .app bundle was produced' >&2
            exit 1
          fi
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "release-assets/Chimera++-macOS-Universal-Test-${GITHUB_SHA}.zip"

      - name: Upload macOS test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimera++-macOS-Universal-Test-${{ github.sha }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7
