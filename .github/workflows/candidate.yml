name: Candidate Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to build"
        required: true
        default: main
        type: string
      candidate_version:
        description: "Expected semantic version (without v)"
        required: true
        default: "2.4.2"
        type: string

permissions:
  contents: read

concurrency:
  group: chimera-candidate-${{ inputs.ref }}-${{ inputs.candidate_version }}
  cancel-in-progress: false

jobs:
  windows:
    name: Candidate Windows package
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record checked-out commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate gates
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
        run: |
          node scripts/verify-release-version.mjs --expect "$env:EXPECTED_VERSION"
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare Tauri signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-tauri-signing-key.sh

      - name: Build Windows candidate
        run: pnpm tauri build --bundles msi

      - name: Collect candidate evidence
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path candidate-assets | Out-Null
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if ($null -eq $msi) { throw 'Windows MSI was not produced' }
          Copy-Item $msi.FullName candidate-assets/
          Get-FileHash candidate-assets/* -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content candidate-assets/SHA256SUMS.txt
          pnpm list --prod --json | Set-Content candidate-assets/frontend-sbom.json
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | Set-Content candidate-assets/rust-sbom.json
          @{
            candidateVersion = $env:EXPECTED_VERSION
            requestedRef = $env:REQUESTED_REF
            commit = $env:SOURCE_COMMIT
            platform = 'windows-x86_64'
          } | ConvertTo-Json | Set-Content candidate-assets/build-provenance.json

      - name: Upload Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimera++-candidate-${{ inputs.candidate_version }}-windows-${{ steps.source.outputs.commit }}
          path: candidate-assets/
          if-no-files-found: error

  macos:
    name: Candidate macOS package
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record checked-out commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate gates
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
        run: |
          node scripts/verify-release-version.mjs --expect "$EXPECTED_VERSION"
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare Tauri signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-tauri-signing-key.sh

      - name: Build universal macOS candidate
        run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Collect candidate evidence
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p candidate-assets
          app_path=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$app_path"
          artifact_name="Chimera++-${{ inputs.candidate_version }}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "candidate-assets/$artifact_name"
          (
            cd candidate-assets
            shasum -a 256 "$artifact_name" > SHA256SUMS.txt
          )
          pnpm list --prod --json > candidate-assets/frontend-sbom.json
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > candidate-assets/rust-sbom.json
          jq -n \
            --arg candidate_version "$EXPECTED_VERSION" \
            --arg requested_ref "$REQUESTED_REF" \
            --arg commit "$SOURCE_COMMIT" \
            --arg platform "darwin-universal" \
            '{candidateVersion: $candidate_version, requestedRef: $requested_ref, commit: $commit, platform: $platform}' \
            > candidate-assets/build-provenance.json

      - name: Upload macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimera++-candidate-${{ inputs.candidate_version }}-macos-${{ steps.source.outputs.commit }}
          path: candidate-assets/
          if-no-files-found: error

  linux:
    name: Candidate Linux x86_64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record checked-out commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            rpm \
            cpio

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate gates
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          node scripts/verify-release-version.mjs --expect "$EXPECTED_VERSION"
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare Tauri signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-tauri-signing-key.sh

      - name: Build Linux candidate
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Smoke test Linux packages
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$GITHUB_WORKSPACE/src-tauri/target/release/bundle"
          appimage=$(find "$bundle_root" -type f -name '*.AppImage' -print -quit)
          deb=$(find "$bundle_root" -type f -name '*.deb' -print -quit)
          rpm_package=$(find "$bundle_root" -type f -name '*.rpm' -print -quit)
          appimage_sig="${appimage}.sig"

          for artifact in "$appimage" "$appimage_sig" "$deb" "$rpm_package"; do
            if [[ ! -s "$artifact" ]]; then
              echo "::error::Missing or empty Linux candidate artifact: ${artifact:-<empty path>}"
              exit 1
            fi
            echo "Validated artifact: $artifact"
          done

          chmod +x "$appimage"
          smoke_root="$RUNNER_TEMP/chimera-linux-smoke"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root/appimage" "$smoke_root/deb" "$smoke_root/rpm"
          (
            cd "$smoke_root/appimage"
            "$appimage" --appimage-extract >/dev/null
            if [[ ! -x squashfs-root/AppRun ]]; then
              echo "::error::AppImage extraction did not produce an executable AppRun"
              exit 1
            fi
            desktop_entry=$(find squashfs-root \( -type f -o -type l \) | grep -E '/[^/]+\.desktop$' | head -1 || true)
            if [[ -z "$desktop_entry" ]]; then
              echo "::error::AppImage does not contain a desktop entry"
              find squashfs-root -maxdepth 4 -type f -o -type l | sort | head -100
              exit 1
            fi
            echo "Validated AppImage desktop entry: $desktop_entry"
          )
          dpkg-deb --info "$deb" >/dev/null
          deb_contents=$(dpkg-deb --contents "$deb")
          if ! grep -Eq '(^|[[:space:]])(\./)?usr/share/applications/[^[:space:]]+\.desktop([[:space:]]|$)' <<<"$deb_contents" ||
             ! grep -Eq '(^|[[:space:]])(\./)?usr/share/icons/[^[:space:]]+([[:space:]]|$)' <<<"$deb_contents"; then
            echo "::error::Deb package does not contain a desktop entry or icon"
            printf '%s\n' "$deb_contents"
            exit 1
          fi
          dpkg-deb --extract "$deb" "$smoke_root/deb"
          deb_desktop=$(find "$smoke_root/deb/usr/share/applications" \( -type f -o -type l \) -name '*.desktop' 2>/dev/null | head -1 || true)
          if [[ -z "$deb_desktop" ]]; then
            echo "::error::Extracted deb package does not contain a desktop entry"
            find "$smoke_root/deb/usr/share" -maxdepth 4 -type f -o -type l 2>/dev/null | sort | head -100
            exit 1
          fi
          echo "Validated deb desktop entry: $deb_desktop"

          rpm -qip "$rpm_package" >/dev/null
          rpm_contents=$(rpm -qlp "$rpm_package")
          if ! grep -Eq '^/usr/share/applications/[^[:space:]]+\.desktop([[:space:]]|$)' <<<"$rpm_contents" ||
             ! grep -Eq '^/usr/share/icons/[^[:space:]]+([[:space:]]|$)' <<<"$rpm_contents"; then
            echo "::error::RPM package does not contain a desktop entry or icon"
            printf '%s\n' "$rpm_contents"
            exit 1
          fi
          (
            cd "$smoke_root/rpm"
            rpm_archive_contents=$(rpm2cpio "$rpm_package" | cpio -t --quiet)
            if ! grep -Eq '(^|[[:space:]])(\./)?usr/share/applications/[^[:space:]]+\.desktop([[:space:]]|$)' <<<"$rpm_archive_contents" ||
               ! grep -Eq '(^|[[:space:]])(\./)?usr/share/icons/[^[:space:]]+([[:space:]]|$)' <<<"$rpm_archive_contents"; then
              echo "::error::RPM archive does not contain a desktop entry or icon"
              printf '%s\n' "$rpm_archive_contents"
              exit 1
            fi
            rpm2cpio "$rpm_package" | cpio -idm --quiet --no-absolute-filenames
            extracted_file=$(find . -mindepth 1 \( -type f -o -type l \) -print -quit 2>/dev/null || true)
            if [[ -z "$extracted_file" ]]; then
              echo "::error::RPM extraction did not produce any files"
              exit 1
            fi
            rpm_desktop=$(grep -E '(^|[[:space:]])(\./)?usr/share/applications/[^[:space:]]+\.desktop([[:space:]]|$)' <<<"$rpm_archive_contents" | head -1)
            echo "Validated RPM archive desktop entry: $rpm_desktop"
          )

      - name: Collect candidate evidence
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p candidate-assets
          appimage=$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)
          deb=$(find src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)
          rpm_package=$(find src-tauri/target/release/bundle -type f -name '*.rpm' -print -quit)
          cp "$appimage" "candidate-assets/Chimera++-$EXPECTED_VERSION-Linux-x86_64.AppImage"
          cp "$appimage.sig" "candidate-assets/Chimera++-$EXPECTED_VERSION-Linux-x86_64.AppImage.sig"
          cp "$deb" "candidate-assets/Chimera++-$EXPECTED_VERSION-Linux-x86_64.deb"
          cp "$rpm_package" "candidate-assets/Chimera++-$EXPECTED_VERSION-Linux-x86_64.rpm"
          (
            cd candidate-assets
            sha256sum Chimera++-* > SHA256SUMS.txt
          )
          pnpm list --prod --json > candidate-assets/frontend-sbom.json
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked > candidate-assets/rust-sbom.json
          jq -n \
            --arg candidate_version "$EXPECTED_VERSION" \
            --arg requested_ref "$REQUESTED_REF" \
            --arg commit "$SOURCE_COMMIT" \
            --arg platform "linux-x86_64" \
            '{candidateVersion: $candidate_version, requestedRef: $requested_ref, commit: $commit, platform: $platform, target: "x86_64-unknown-linux-gnu"}' \
            > candidate-assets/build-provenance.json

      - name: Upload Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimera++-candidate-${{ inputs.candidate_version }}-linux-x86_64-${{ steps.source.outputs.commit }}
          path: candidate-assets/
          if-no-files-found: error
