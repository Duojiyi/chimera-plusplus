name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-release:
    name: Verify release commit and required CI
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout tag and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Verify tag identity and required CI checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo "Tag commit mismatch: git=$tag_commit event=$RELEASE_SHA" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag must point to a commit reachable from main: $tag_commit" >&2
            exit 1
          fi
          node scripts/verify-release-version.mjs --expect "$RELEASE_TAG"

          ci_runs_json=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tag_commit&event=push&per_page=100")
          ci_run_id=$(jq -r --arg sha "$tag_commit" '
            .workflow_runs[]
            | select(
                .head_sha == $sha
                and .head_branch == "main"
                and .status == "completed"
                and .conclusion == "success"
              )
            | .id
          ' <<<"$ci_runs_json" | head -n 1)
          if [[ -z "$ci_run_id" || "$ci_run_id" == "null" ]]; then
            echo "No successful ci.yml push run on main found for $tag_commit" >&2
            exit 1
          fi
          jobs_json=$(gh api "repos/$REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100")
          required_jobs=(
            "Windows Frontend Validation"
            "Backend Validation (windows-2022)"
            "Backend Validation (macos-15)"
          )
          for required_job in "${required_jobs[@]}"; do
            if ! jq -e --arg name "$required_job" \
              '.jobs[] | select(.name == $name and .conclusion == "success")' \
              <<<"$jobs_json" >/dev/null; then
              echo "Required CI job did not pass: $required_job" >&2
              exit 1
            fi
          done
          echo "Release $RELEASE_TAG is bound to audited commit $tag_commit and successful CI run $ci_run_id"

  release:
    needs: verify-release
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
            arch: arm64
          - os: macos-15
            arch: universal
          - os: ubuntu-22.04
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record source commit
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'SOURCE_COMMIT=%s\n' "$commit" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.12.3
          run_install: false

      - name: Setup pnpm (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare pnpm@10.12.3 --activate
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Verify release version consistency
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: node scripts/verify-release-version.mjs --expect "$RELEASE_TAG"

      - name: Verify renderer contracts
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        run: pnpm exec tsc --noEmit

      - name: Verify Codex account and relay switching
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test provider_service provider_service_switch_codex
          cargo test --manifest-path src-tauri/Cargo.toml --test provider_commands codex_startup_import

      - name: Prepare Tauri signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-tauri-signing-key.sh

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== unsigned macOS build attempt ${attempt}/${max_attempts} ==="
            if pnpm tauri build --target universal-apple-darwin; then
              echo "✅ unsigned macOS build succeeded"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ unsigned macOS build failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ unsigned macOS build failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0

          # Locate bundle artifacts
          TAR_GZ=""; APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$TAR_GZ" ]   && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$TAR_GZ" ]; then
            echo "❌ No macOS .tar.gz updater artifact found" >&2
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          # 1) Collect .tar.gz (updater artifact)
          NEW_TAR_GZ="Chimera++-${VERSION}-macOS.tar.gz"
          cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
          if [ ! -s "$TAR_GZ.sig" ]; then
            echo "❌ Signed macOS updater artifact is required: $TAR_GZ.sig" >&2
            exit 1
          fi
          cp "$TAR_GZ.sig" "release-assets/$NEW_TAR_GZ.sig"
          echo "macOS updater artifact copied: $NEW_TAR_GZ"

          # 2) Collect .app as zip
          NEW_ZIP="Chimera++-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create an unsigned styled DMG for manual installation.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="Chimera++-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/Chimera++.app"

          create-dmg \
            --volname "Chimera++" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "Chimera++.app" 180 220 \
            --hide-extension "Chimera++.app" \
            --app-drop-link 480 220 \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Unsigned styled DMG created: $NEW_DMG"

      - name: Verify unsigned macOS assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/Chimera++-${GITHUB_REF_NAME}-macOS.tar.gz
          test -s release-assets/Chimera++-${GITHUB_REF_NAME}-macOS.tar.gz.sig
          test -s release-assets/Chimera++-${GITHUB_REF_NAME}-macOS.zip
          test -s release-assets/Chimera++-${GITHUB_REF_NAME}-macOS.dmg
          hdiutil verify release-assets/Chimera++-${GITHUB_REF_NAME}-macOS.dmg
          echo "✅ Unsigned macOS assets and updater signature are present"

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME  # e.g., v3.5.0
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 仅打包 MSI 安装器 + .sig（用于 Updater）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "Chimera++-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (Test-Path $sigPath) {
              Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
              Write-Host "Signature copied: $dest.sig"
            } else {
              throw "Signature not found for $($msi.Name)"
            }
          } else {
            throw "No Windows $($env:WINDOWS_RELEASE_ARCH) MSI installer found"
          }

          # Chimera++ 1.x uses its own updater and can only launch an NSIS setup
          # whose filename follows the legacy artifact contract exactly.
          if (-not $isArm64) {
            $legacyVersion = $VERSION.TrimStart('v', 'V')
            $nsisInstallers = @(Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Recurse -Include *.exe -ErrorAction SilentlyContinue)
            if ($nsisInstallers.Count -ne 1) {
              throw "Expected exactly one legacy-compatible NSIS installer, found $($nsisInstallers.Count)"
            }
            $legacyDest = "ChimeraPlusPlus-$legacyVersion-windows-x64-setup.exe"
            Copy-Item $nsisInstallers[0].FullName (Join-Path release-assets $legacyDest)
            Write-Host "Legacy updater installer copied: $legacyDest"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exeCandidates = if ($isArm64) {
            @('src-tauri/target/aarch64-pc-windows-msvc/release/chimera-plus-plus.exe')
          } else {
            @(
              'src-tauri/target/release/chimera-plus-plus.exe',
              'src-tauri/target/x86_64-pc-windows-msvc/release/chimera-plus-plus.exe'
            )
          }
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/Chimera++-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir

            # Bundle one exact, audited Codex desktop package from the pinned mirror release.
            $codexMirrorRepository = 'Duojiyi/codex-app-mirror'
            $codexMirrorTag = 'codex-app-26.721.41059'
            $codexMirrorCommit = '84c625145ad2e2cfc6f06439250c1fddce0eff14'
            $apiHeaders = @{
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent' = 'Chimera-Release'
            }
            $mirrorRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/$codexMirrorRepository/releases/tags/$codexMirrorTag" -Headers $apiHeaders
            if ($mirrorRelease.tag_name -ne $codexMirrorTag) {
              throw "Codex mirror release tag mismatch: $($mirrorRelease.tag_name)"
            }
            $mirrorCommitResponse = Invoke-RestMethod -Uri "https://api.github.com/repos/$codexMirrorRepository/commits/$codexMirrorTag" -Headers $apiHeaders
            if ($mirrorCommitResponse.sha -ne $codexMirrorCommit) {
              throw "Codex mirror commit mismatch: expected $codexMirrorCommit, got $($mirrorCommitResponse.sha)"
            }
            $archPattern = if ($isArm64) { '_arm64__.*\.Msix$' } else { '_x64__.*\.Msix$' }
            $msixAssets = @($mirrorRelease.assets | Where-Object { $_.name -match $archPattern })
            $sumsAssets = @($mirrorRelease.assets | Where-Object { $_.name -eq 'SHA256SUMS-windows.txt' })
            if ($msixAssets.Count -ne 1 -or $sumsAssets.Count -ne 1) {
              throw "Codex mirror must contain exactly one $env:WINDOWS_RELEASE_ARCH MSIX and one SHA256SUMS-windows.txt"
            }
            $msixAsset = $msixAssets[0]
            $sumsAsset = $sumsAssets[0]
            $codexMsix = Join-Path $env:RUNNER_TEMP $msixAsset.name
            $checksumFile = Join-Path $env:RUNNER_TEMP 'SHA256SUMS-windows.txt'
            Invoke-WebRequest -Uri $msixAsset.browser_download_url -OutFile $codexMsix
            Invoke-WebRequest -Uri $sumsAsset.browser_download_url -OutFile $checksumFile
            $checksumPattern = "(^|\s){0}$" -f [regex]::Escape($msixAsset.name)
            $checksumLine = @(Get-Content $checksumFile | Where-Object { $_ -match $checksumPattern }) | Select-Object -First 1
            $expectedHash = (($checksumLine -split '\s+')[0])
            $actualHash = (Get-FileHash -Algorithm SHA256 $codexMsix).Hash.ToLowerInvariant()
            if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$' -or $actualHash -ne $expectedHash.ToLowerInvariant()) {
              throw 'Codex mirror checksum verification failed'
            }
            $codexArchive = Join-Path $env:RUNNER_TEMP 'codex-package.zip'
            Copy-Item $codexMsix $codexArchive
            Expand-Archive -LiteralPath $codexArchive -DestinationPath (Join-Path $portableDir 'Codex') -Force
            Set-Content -Path (Join-Path $portableDir 'Codex\CHIMERA-CODEX-VERSION.txt') -Value "$codexMirrorTag`n$codexMirrorCommit" -Encoding UTF8
            $codexPlatform = if ($isArm64) { 'windows-arm64' } else { 'windows-x86_64' }
            [ordered]@{
              schemaVersion = 1
              repository = $codexMirrorRepository
              tag = $codexMirrorTag
              commit = $codexMirrorCommit
              asset = $msixAsset.name
              sha256 = $actualHash
            } | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path 'release-assets' "codex-mirror-provenance-$codexPlatform.json") -Encoding UTF8
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = if ($isArm64) {
              @(
                '# Chimera++ portable ARM64 build marker',
                'portable=true',
                'arch=arm64',
                'codexRoot=Codex'
              )
            } else {
              @(
                '# Chimera++ portable build marker',
                'portable=true',
                'codexRoot=Codex'
              )
            }
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/Chimera++-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: Chimera++-$VERSION-Windows$assetSuffix-Portable.zip"
          } elseif ($isArm64) {
            throw 'Portable ARM64 exe not found'
          } else {
            throw 'Portable exe not found'
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # Updater artifact: AppImage（含对应 .sig）
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            NEW_APPIMAGE="Chimera++-${VERSION}-Linux-${ARCH}.AppImage"
            cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
            if [ ! -s "$APPIMAGE.sig" ]; then
              echo "Signed AppImage updater artifact is required: $APPIMAGE.sig" >&2
              exit 1
            fi
            cp "$APPIMAGE.sig" "release-assets/$NEW_APPIMAGE.sig"
            echo "AppImage copied: $NEW_APPIMAGE"
          else
            echo "No AppImage found under target/release/bundle" >&2
            exit 1
          fi
          # 额外上传 .deb（用于手动安装，不参与 Updater）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/Chimera++-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: Chimera++-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "Required .deb package was not produced" >&2
            exit 1
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等，不参与 Updater）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/Chimera++-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: Chimera++-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "Required .rpm package was not produced" >&2
            exit 1
          fi

      - name: Generate Windows release evidence
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') { 'windows-arm64' } else { 'windows-x86_64' }
          $mirrorPath = Join-Path (Get-Location) "release-assets/codex-mirror-provenance-$platform.json"
          if (-not (Test-Path -LiteralPath $mirrorPath)) {
            throw "Missing Codex mirror provenance: $mirrorPath"
          }
          $codexMirror = Get-Content -LiteralPath $mirrorPath -Raw | ConvertFrom-Json
          $frontendSbom = pnpm list --prod --json
          if ($LASTEXITCODE -ne 0) { throw "Frontend SBOM generation failed with exit code $LASTEXITCODE" }
          $frontendSbom | Set-Content -Path (Join-Path 'release-assets' "frontend-sbom-$platform.json") -Encoding UTF8
          $rustSbom = cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { throw "Rust SBOM generation failed with exit code $LASTEXITCODE" }
          $rustSbom | Set-Content -Path (Join-Path 'release-assets' "rust-sbom-$platform.json") -Encoding UTF8
          # Read the actually-locked revisions out of Cargo.lock instead of hardcoding
          # them here, so this provenance can never silently drift out of sync with
          # what was actually built.
          function Get-CargoLockRevision([string]$PackageName) {
            $revision = node scripts/extract-cargo-lock-revision.mjs --package $PackageName
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract Cargo.lock revision for $PackageName" }
            return $revision.Trim()
          }
          $chimeraRuntimeRev = Get-CargoLockRevision 'chimera-runtime'
          $chimeraPlatformRev = Get-CargoLockRevision 'chimera-platform'
          $codexWinEngineRev = Get-CargoLockRevision 'codex-win-engine'
          $codexThemeEngineRev = Get-CargoLockRevision 'codex-theme-engine'
          $externalGitDependencies = @(
            [ordered]@{ package = 'chimera-runtime'; repository = 'https://github.com/Duojiyi/chimera-codex.git'; revision = $chimeraRuntimeRev },
            [ordered]@{ package = 'chimera-platform'; repository = 'https://github.com/Duojiyi/chimera-codex.git'; revision = $chimeraPlatformRev },
            [ordered]@{ package = 'codex-win-engine'; repository = 'https://github.com/Wangnov/Codex-App-Manager.git'; revision = $codexWinEngineRev },
            [ordered]@{ package = 'codex-theme-engine'; repository = 'https://github.com/Wangnov/Codex-App-Manager.git'; revision = $codexThemeEngineRev }
          )
          $target = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          [ordered]@{
            schemaVersion = 1
            releaseTag = $env:RELEASE_TAG
            sourceCommit = $env:SOURCE_COMMIT
            platform = $platform
            runner = [ordered]@{
              name = $env:RUNNER_NAME
              os = $env:RUNNER_OS
              arch = $env:RUNNER_ARCH
            }
            target = $target
            externalGitDependencies = $externalGitDependencies
            codexMirror = $codexMirror
          } | ConvertTo-Json -Depth 10 | Set-Content -Path (Join-Path 'release-assets' "build-provenance-$platform.json") -Encoding UTF8
          $checksumName = "SHA256SUMS-$platform.txt"
          $assetFiles = @(Get-ChildItem -LiteralPath 'release-assets' -File | Where-Object { $_.Name -ne $checksumName } | Sort-Object Name)
          if ($assetFiles.Count -eq 0) {
            throw "No release assets found for checksum generation: $platform"
          }
          # sha256sum -c runs later on Linux, so generate the canonical
          # checksum format with LF line endings (not PowerShell's CRLF).
          $checksumContent = $assetFiles | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $_.Name
          }
          [System.IO.File]::WriteAllText(
            (Join-Path 'release-assets' $checksumName),
            (($checksumContent -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          if (-not (Test-Path -LiteralPath (Join-Path 'release-assets' $checksumName))) {
            throw "Checksum file was not generated: $checksumName"
          }

      - name: Generate macOS release evidence
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          platform='macos-universal'
          pnpm list --prod --json > "release-assets/frontend-sbom-$platform.json"
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked > "release-assets/rust-sbom-$platform.json"
          # Read the actually-locked revisions out of Cargo.lock instead of hardcoding
          # them here, so this provenance can never silently drift out of sync with
          # what was actually built.
          chimera_runtime_rev=$(node scripts/extract-cargo-lock-revision.mjs --package chimera-runtime)
          chimera_platform_rev=$(node scripts/extract-cargo-lock-revision.mjs --package chimera-platform)
          codex_win_engine_rev=$(node scripts/extract-cargo-lock-revision.mjs --package codex-win-engine)
          codex_theme_engine_rev=$(node scripts/extract-cargo-lock-revision.mjs --package codex-theme-engine)
          external_git_dependencies_json=$(jq -n \
            --arg chimera_runtime_rev "$chimera_runtime_rev" \
            --arg chimera_platform_rev "$chimera_platform_rev" \
            --arg codex_win_engine_rev "$codex_win_engine_rev" \
            --arg codex_theme_engine_rev "$codex_theme_engine_rev" \
            '[
              {"package":"chimera-runtime","repository":"https://github.com/Duojiyi/chimera-codex.git","revision":$chimera_runtime_rev},
              {"package":"chimera-platform","repository":"https://github.com/Duojiyi/chimera-codex.git","revision":$chimera_platform_rev},
              {"package":"codex-win-engine","repository":"https://github.com/Wangnov/Codex-App-Manager.git","revision":$codex_win_engine_rev},
              {"package":"codex-theme-engine","repository":"https://github.com/Wangnov/Codex-App-Manager.git","revision":$codex_theme_engine_rev}
            ]')
          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg platform "$platform" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --argjson external_git_dependencies "$external_git_dependencies_json" \
            '{
              schemaVersion: 1,
              releaseTag: $release_tag,
              sourceCommit: $source_commit,
              platform: $platform,
              runner: {name: $runner_name, os: $runner_os, arch: $runner_arch},
              target: "universal-apple-darwin",
              appleDeveloperIdSigned: false,
              notarized: false,
              externalGitDependencies: $external_git_dependencies
            }' > "release-assets/build-provenance-$platform.json"
          checksum_name="SHA256SUMS-$platform.txt"
          (
            cd release-assets
            for asset in *; do
              [ "$asset" = "$checksum_name" ] && continue
              [ -f "$asset" ] || continue
              shasum -a 256 "$asset"
            done
          ) > "release-assets/$checksum_name"
          test -s "release-assets/$checksum_name"

      - name: Generate Linux release evidence
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          platform='linux-x86_64'
          pnpm list --prod --json > "release-assets/frontend-sbom-$platform.json"
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked > "release-assets/rust-sbom-$platform.json"
          # Read the actually-locked revisions out of Cargo.lock instead of hardcoding
          # them here, so this provenance can never silently drift out of sync with
          # what was actually built.
          chimera_runtime_rev=$(node scripts/extract-cargo-lock-revision.mjs --package chimera-runtime)
          chimera_platform_rev=$(node scripts/extract-cargo-lock-revision.mjs --package chimera-platform)
          codex_win_engine_rev=$(node scripts/extract-cargo-lock-revision.mjs --package codex-win-engine)
          codex_theme_engine_rev=$(node scripts/extract-cargo-lock-revision.mjs --package codex-theme-engine)
          external_git_dependencies_json=$(jq -n \
            --arg chimera_runtime_rev "$chimera_runtime_rev" \
            --arg chimera_platform_rev "$chimera_platform_rev" \
            --arg codex_win_engine_rev "$codex_win_engine_rev" \
            --arg codex_theme_engine_rev "$codex_theme_engine_rev" \
            '[
              {"package":"chimera-runtime","repository":"https://github.com/Duojiyi/chimera-codex.git","revision":$chimera_runtime_rev},
              {"package":"chimera-platform","repository":"https://github.com/Duojiyi/chimera-codex.git","revision":$chimera_platform_rev},
              {"package":"codex-win-engine","repository":"https://github.com/Wangnov/Codex-App-Manager.git","revision":$codex_win_engine_rev},
              {"package":"codex-theme-engine","repository":"https://github.com/Wangnov/Codex-App-Manager.git","revision":$codex_theme_engine_rev}
            ]')
          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg platform "$platform" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --argjson external_git_dependencies "$external_git_dependencies_json" \
            '{
              schemaVersion: 1,
              releaseTag: $release_tag,
              sourceCommit: $source_commit,
              platform: $platform,
              runner: {name: $runner_name, os: $runner_os, arch: $runner_arch},
              target: "x86_64-unknown-linux-gnu",
              publisherSigned: false,
              updaterSigned: true,
              externalGitDependencies: $external_git_dependencies
            }' > "release-assets/build-provenance-$platform.json"
          checksum_name="SHA256SUMS-$platform.txt"
          (
            cd release-assets
            for asset in *; do
              [ "$asset" = "$checksum_name" ] && continue
              [ -f "$asset" ] || continue
              sha256sum "$asset"
            done
          ) > "release-assets/$checksum_name"
          test -s "release-assets/$checksum_name"

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          sig_files=(release-assets/*.sig)
          if [ ! -e "${sig_files[0]}" ]; then
            echo "No updater signatures were produced for $RUNNER_OS" >&2
            exit 1
          fi
          printf '%s\n' "Collected signatures:"
          ls -la -- release-assets/*.sig

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Download built release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-assets-*
          path: downloaded-release-assets
          merge-multiple: false

      - name: Merge release artifacts without overwriting
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          found=0
          while IFS= read -r -d '' source; do
            found=1
            name=$(basename "$source")
            destination="release-assets/$name"
            if [ -e "$destination" ]; then
              echo "Duplicate release asset name detected: $name" >&2
              exit 1
            fi
            cp -- "$source" "$destination"
          done < <(find downloaded-release-assets -type f -print0 | sort -z)
          if [ "$found" -ne 1 ]; then
            echo "No release artifact files were downloaded" >&2
            exit 1
          fi

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print -exec ls -l {} \;

      - name: Verify release evidence and updater signatures
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          required_files=(
            "Chimera++-$tag-Windows.msi"
            "Chimera++-$tag-Windows-arm64.msi"
            "Chimera++-$tag-Windows-Portable.zip"
            "Chimera++-$tag-Windows-arm64-Portable.zip"
            "ChimeraPlusPlus-${tag#v}-windows-x64-setup.exe"
            "Chimera++-$tag-macOS.tar.gz"
            "Chimera++-$tag-macOS.zip"
            "Chimera++-$tag-macOS.dmg"
            "Chimera++-$tag-Linux-x86_64.AppImage"
            "Chimera++-$tag-Linux-x86_64.AppImage.sig"
            "Chimera++-$tag-Linux-x86_64.deb"
            "Chimera++-$tag-Linux-x86_64.rpm"
            "SHA256SUMS-windows-x86_64.txt"
            "SHA256SUMS-windows-arm64.txt"
            "SHA256SUMS-macos-universal.txt"
            "SHA256SUMS-linux-x86_64.txt"
            "frontend-sbom-windows-x86_64.json"
            "frontend-sbom-windows-arm64.json"
            "frontend-sbom-macos-universal.json"
            "frontend-sbom-linux-x86_64.json"
            "rust-sbom-windows-x86_64.json"
            "rust-sbom-windows-arm64.json"
            "rust-sbom-macos-universal.json"
            "rust-sbom-linux-x86_64.json"
            "build-provenance-windows-x86_64.json"
            "build-provenance-windows-arm64.json"
            "build-provenance-macos-universal.json"
            "build-provenance-linux-x86_64.json"
            "codex-mirror-provenance-windows-x86_64.json"
            "codex-mirror-provenance-windows-arm64.json"
          )
          for file in "${required_files[@]}"; do
            test -s "release-assets/$file" || { echo "Missing release evidence or asset: $file" >&2; exit 1; }
          done
          updater_artifacts=(
            "Chimera++-$tag-Windows.msi"
            "Chimera++-$tag-Windows-arm64.msi"
            "Chimera++-$tag-macOS.tar.gz"
            "Chimera++-$tag-Linux-x86_64.AppImage"
          )
          for artifact in "${updater_artifacts[@]}"; do
            test -s "release-assets/$artifact"
            test -s "release-assets/$artifact.sig" || { echo "Missing updater signature: $artifact.sig" >&2; exit 1; }
          done
          for checksum in \
            SHA256SUMS-windows-x86_64.txt \
            SHA256SUMS-windows-arm64.txt \
            SHA256SUMS-macos-universal.txt \
            SHA256SUMS-linux-x86_64.txt; do
            (cd release-assets && sha256sum -c "$checksum")
          done
          node scripts/verify-release-evidence.mjs \
            --assets-dir release-assets \
            --tag "$tag" \
            --commit "$RELEASE_COMMIT"
          node scripts/verify-updater-signatures.mjs \
            --assets-dir release-assets \
            --asset "Chimera++-$tag-Windows.msi" \
            --asset "Chimera++-$tag-Windows-arm64.msi" \
            --asset "Chimera++-$tag-macOS.tar.gz" \
            --asset "Chimera++-$tag-Linux-x86_64.AppImage"

      - name: Upload Release Assets
        # make_latest is intentionally false here: this publishes the release
        # with every asset already attached, but does NOT yet point
        # `releases/latest` at it. The assemble-latest-json job below still
        # has to build, verify, and upload latest.json — if that job fails,
        # we must not have already made this (incomplete-for-updater)
        # release "latest", or the updater endpoint would 404 for every
        # existing install until someone notices and intervenes. The final
        # step of assemble-latest-json flips make_latest to true only after
        # latest.json is confirmed present and valid.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          name: Chimera++ ${{ github.ref_name }}
          prerelease: false
          make_latest: false
          body: |
            ## Chimera++ ${{ github.ref_name }}

            Codex 供应商切换与桌面运行时管理工具。

            ### 下载

            - **Windows (x86_64)**: `Chimera++-${{ github.ref_name }}-Windows.msi`（安装版）或 `Chimera++-${{ github.ref_name }}-Windows-Portable.zip`（绿色版）
            - **Windows (ARM64)**: `Chimera++-${{ github.ref_name }}-Windows-arm64.msi`（安装版）或 `Chimera++-${{ github.ref_name }}-Windows-arm64-Portable.zip`（绿色版）
            - **macOS (Universal)**: `Chimera++-${{ github.ref_name }}-macOS.dmg`（推荐）或 `Chimera++-${{ github.ref_name }}-macOS.zip`，同时支持 Intel 与 Apple Silicon
            - **Linux (x86_64)**: `Chimera++-${{ github.ref_name }}-Linux-x86_64.AppImage`、`.deb` 或 `.rpm`

            Windows 绿色版已内置经 SHA-256 校验的 Codex 桌面本体。macOS 版本未进行 Apple Developer ID 签名和公证；Linux 手动安装包也未提供发行者代码签名。`.sig` 仅表示独立的 Tauri 应用内更新签名，不等同于 Authenticode、Apple Developer ID 或 Linux 发行者签名。请使用对应的 `SHA256SUMS-*.txt` 校验手动安装包。`latest.json` 供自动更新使用，更新失败时旧版本不会被替换。`ChimeraPlusPlus-*-windows-x64-setup.exe` 是供 Chimera++ 1.x 自动升级到 2.0 使用的兼容安装器。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: publish-release
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Prepare GH
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            if ! command -v curl >/dev/null 2>&1; then
              echo "GitHub CLI is missing and curl is unavailable for installation" >&2
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          command -v gh >/dev/null 2>&1
          gh --version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          if ! find dl -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "No release assets were downloaded for $TAG" >&2
            exit 1
          fi
          ls -la dl
      - name: Verify uploaded updater signatures
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/verify-updater-signatures.mjs \
            --assets-dir dl \
            --asset "Chimera++-$RELEASE_TAG-Windows.msi" \
            --asset "Chimera++-$RELEASE_TAG-Windows-arm64.msi" \
            --asset "Chimera++-$RELEASE_TAG-macOS.tar.gz" \
            --asset "Chimera++-$RELEASE_TAG-Linux-x86_64.AppImage"
      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"

          platform_json='{}'
          add_platform() {
            local key="$1" artifact="$2"
            local asset="dl/$artifact"
            local sig="$asset.sig"
            if [ ! -s "$asset" ]; then
              echo "Missing updater artifact: $artifact" >&2
              return 1
            fi
            if [ ! -s "$sig" ]; then
              echo "Missing updater signature: $artifact.sig" >&2
              return 1
            fi
            platform_json=$(jq \
              --arg key "$key" \
              --arg url "$base_url/$artifact" \
              --arg signature "$(cat "$sig")" \
              '. + {($key): {signature: $signature, url: $url}}' <<< "$platform_json")
          }

          add_platform windows-x86_64 "Chimera++-$TAG-Windows.msi"
          add_platform windows-aarch64 "Chimera++-$TAG-Windows-arm64.msi"
          add_platform darwin-x86_64 "Chimera++-$TAG-macOS.tar.gz"
          add_platform darwin-aarch64 "Chimera++-$TAG-macOS.tar.gz"
          add_platform linux-x86_64 "Chimera++-$TAG-Linux-x86_64.AppImage"

          if [ "$(jq 'length' <<< "$platform_json")" -ne 5 ]; then
            echo 'Signed Windows, macOS, and Linux x86_64 updater platforms are required' >&2
            exit 1
          fi

          legacy_name="ChimeraPlusPlus-$VERSION-windows-x64-setup.exe"
          legacy_path="dl/$legacy_name"
          if [ ! -f "$legacy_path" ]; then
            echo "Legacy-compatible installer missing: $legacy_name" >&2
            exit 1
          fi
          legacy_sha256=$(sha256sum "$legacy_path" | awk '{print $1}')
          legacy_size=$(stat -c%s "$legacy_path")

          jq -n \
            --arg version "$VERSION" \
            --arg minimum "1.2.42-chimera.1" \
            --arg release_url "https://github.com/$REPO/releases/tag/$TAG" \
            --arg body "Chimera++ $TAG release" \
            --arg notes "Release $TAG" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$platform_json" \
            --arg asset_name "$legacy_name" \
            --arg asset_url "$base_url/$legacy_name" \
            --arg asset_sha256 "$legacy_sha256" \
            --argjson asset_size "$legacy_size" \
            '{
              version: $version,
              minimum_supported_version: $minimum,
              url: $release_url,
              body: $body,
              notes: $notes,
              pub_date: $pub_date,
              platforms: $platforms,
              assets: [{
                name: $asset_name,
                url: $asset_url,
                sha256: $asset_sha256,
                size: $asset_size
              }]
            }' > latest.json

          jq -e \
            '.platforms["windows-x86_64"].signature != "" and
             .platforms["windows-aarch64"].signature != "" and
             .platforms["darwin-x86_64"].signature != "" and
             .platforms["darwin-aarch64"].signature != "" and
             .platforms["linux-x86_64"].signature != "" and
             (.assets | length == 1) and
             (.assets[0].sha256 | test("^[0-9a-f]{64}$")) and
             (.assets[0].size > 0)' \
            latest.json >/dev/null
          echo 'Generated latest.json:'
          jq . latest.json
      - name: Verify updater metadata and release assets
        run: node scripts/verify-updater-metadata.mjs --file latest.json --tag "${{ github.ref_name }}" --assets-dir dl
      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Mark release as latest
        # Only now — after every asset plus a verified latest.json is
        # confirmed present on the release — do we point `releases/latest`
        # (and therefore the updater endpoint) at this release. Until this
        # step runs, existing installs keep resolving the previous, fully
        # intact release as latest.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "Could not resolve release id for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f make_latest=true >/dev/null
          echo "Marked $GITHUB_REF_NAME as the latest release."
