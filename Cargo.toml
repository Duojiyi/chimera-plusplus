[workspace]
resolver = "2"
members = [
  # ── v2 crates (Chimera++ 2.0 independent product) ──────────────────────
  "crates/chimera-domain",
  "crates/chimera-platform",
  "crates/chimera-provider",
  "crates/chimera-runtime",
  "crates/chimera-theme",
  "crates/chimera-migration",
  # Chimera's own updater. Separate from chimera-runtime on purpose: G8/G15
  # require the app's trust root to be independent of the Codex mirror's, and
  # sharing a crate is how those two domains start sharing state.
  "crates/chimera-update",
  "services/mirror-contract",
  "apps/chimera-desktop/src-tauri",
  # ── 1.x legacy (maintenance only, no new features) ─────────────────────
  "crates/codex-plus-core",
  "crates/codex-plus-data",
  "apps/codex-plus-launcher",
  "apps/codex-plus-manager/src-tauri",
]

[workspace.package]
version = "1.2.42-chimera.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Duojiyi/chimera-codex"

[workspace.dependencies]
aes-gcm = "0.10"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
anyhow = "1"
base64 = "0.22"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
# OS credential store: Windows Credential Manager / macOS Keychain / Linux
# Secret Service behind one API. Default `v1` feature pulls the native backend
# for each platform, satisfying ADR-007 (same entrypoint on Windows + macOS).
keyring = "4.1.5"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
# Blocking WebSocket. CDP on loopback is always plaintext ws://, so no TLS
# feature is pulled in — and the sync API matches chimera-theme's sync
# CdpClient trait without dragging an async runtime into that crate.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
toml_edit = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
winresource = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Pinned MIT engine from Wangnov/Codex-App-Manager. Keeping this as an exact
# git revision lets Chimera reuse the audited Windows installer without
# copying a second implementation into this repository.
codex-win-engine = { git = "https://github.com/Wangnov/Codex-App-Manager.git", rev = "d29fda32d8813f9af879c0a80c86ddaa26024c6d", package = "codex-win-engine" }
codex-theme-engine = { git = "https://github.com/Wangnov/Codex-App-Manager.git", rev = "d29fda32d8813f9af879c0a80c86ddaa26024c6d", package = "codex-theme-engine" }
